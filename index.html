<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#E7E5E0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161A22" media="(prefers-color-scheme: dark)">
<meta name="description" content="Kam s paddleboardom a na freedive — 56 lokalít do 9 hodín jazdy z Bratislavy, zoradených podľa viditeľnosti pod vodou.">
<title>SUP &amp; Freedive — 56 vôd do 9 h z Bratislavy</title>
<style>
:root{
  --ground:#E7E5E0; --panel:#F4F3F0; --panel-2:#DBD8D1; --line:#C3BEB4;
  --ink:#1A2030; --ink-2:#4A5265; --ink-3:#7C8394;
  --accent:#1D5FA8; --accent-soft:#DBE5F1;
  --good:#3D7A4E; --warn:#A8730F; --crit:#B0392B;
  --murk:#9A8B62; --clear:#1D7FB8;
  --w-lake:#1D7FB8; --w-sea:#0E8C7F; --w-river:#B5772A;
  --shadow:0 1px 2px rgba(26,32,48,.08),0 8px 22px -14px rgba(26,32,48,.3);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#161A22; --panel:#1E232E; --panel-2:#2A3140; --line:#3A4354;
  --ink:#E8E6E1; --ink-2:#B0B5C0; --ink-3:#828A99;
  --accent:#6FA8E8; --accent-soft:#22364F;
  --good:#67B57E; --warn:#D9A63F; --crit:#E07060;
  --murk:#B0A177; --clear:#4FA8D8;
  --w-lake:#4FA8D8; --w-sea:#3ECAB4; --w-river:#E0A455;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 8px 22px -14px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --ground:#161A22; --panel:#1E232E; --panel-2:#2A3140; --line:#3A4354;
  --ink:#E8E6E1; --ink-2:#B0B5C0; --ink-3:#828A99;
  --accent:#6FA8E8; --accent-soft:#22364F;
  --good:#67B57E; --warn:#D9A63F; --crit:#E07060;
  --murk:#B0A177; --clear:#4FA8D8;
  --w-lake:#4FA8D8; --w-sea:#3ECAB4; --w-river:#E0A455;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 8px 22px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:Charter,"Bitstream Charter","Iowan Old Style","Palatino Linotype",Georgia,serif;
  font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,h3,.disp{font-family:"Avenir Next Condensed","Helvetica Neue Condensed",
  "Roboto Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  font-weight:600;letter-spacing:.005em;text-wrap:balance;margin:0}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

header{border-bottom:1px solid var(--line);background:var(--panel)}
.hbar{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;
  justify-content:space-between;padding:26px 0 20px}
h1{font-size:clamp(26px,4.4vw,40px);line-height:1.02}
h1 em{font-style:normal;color:var(--accent)}
.sub{color:var(--ink-2);font-size:14.5px;margin-top:7px;max-width:60ch}
.hbtns{display:flex;gap:8px}
.tbtn{font-family:inherit;font-size:13px;color:var(--ink-2);background:var(--panel-2);
  border:1px solid var(--line);border-radius:2px;padding:7px 13px;cursor:pointer}
.tbtn:hover{color:var(--ink)}
.tbtn:focus-visible,select:focus-visible,input:focus-visible,button:focus-visible,
circle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.chartbox{background:var(--panel);border:1px solid var(--line);border-radius:3px;
  padding:18px 16px 8px;margin:26px 0;position:relative}
.tip{position:absolute;pointer-events:none;z-index:5;background:var(--ink);
  color:var(--panel);padding:5px 9px;border-radius:2px;font-size:12.5px;
  white-space:nowrap;transform:translate(-50%,-150%);box-shadow:var(--shadow);
  font-family:"Avenir Next Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  letter-spacing:.02em}
.tip b{font-weight:600}
.tip i{font-style:normal;opacity:.72;font-family:ui-monospace,Menlo,monospace;
  font-size:11px;margin-left:6px}
.tip[hidden]{display:none}
.chead{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;
  align-items:baseline;margin-bottom:4px}
.eyebrow{font-family:"Avenir Next Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.chartscroll{overflow-x:auto}
svg.depth{display:block;min-width:660px;width:100%;height:300px}
svg.mapsvg{display:block;min-width:700px;width:100%;height:auto}
svg.mapsvg[hidden],svg.depth[hidden]{display:none}
.segs{display:flex;gap:0;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.seg{font-family:"Avenir Next Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:6px 14px;
  background:var(--panel);color:var(--ink-3);border:0;cursor:pointer}
.seg+.seg{border-left:1px solid var(--line)}
.seg.on{background:var(--accent);color:var(--panel)}
.seg:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.gmapbtn{text-decoration:none;color:var(--accent);border-color:var(--accent);white-space:nowrap;font-family:"Avenir Next Condensed","Roboto Condensed","Arial Narrow",sans-serif;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.gmapbtn:hover{background:var(--accent);color:var(--panel)}
.land{fill:var(--panel-2);stroke:var(--line);stroke-width:.7;stroke-linejoin:round}
.sea{fill:var(--accent-soft)}
.lake{fill:var(--w-lake);fill-opacity:.35;stroke:var(--w-lake);stroke-width:.6;stroke-opacity:.6}
.ring{fill:none;stroke:var(--accent);stroke-width:.9;stroke-dasharray:5 5;stroke-opacity:.55}
.ringlab{font-family:"Avenir Next Condensed","Roboto Condensed",sans-serif;font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;fill:var(--accent);opacity:.85}
.cname-lab{font-family:"Avenir Next Condensed","Roboto Condensed",sans-serif;font-size:11.5px;
  letter-spacing:.16em;text-transform:uppercase;fill:var(--ink-3);opacity:.75}
.home{fill:var(--ink)}
.homelab{font-family:"Avenir Next Condensed","Roboto Condensed",sans-serif;font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;fill:var(--ink)}
.dot{cursor:pointer;transition:r .15s ease}
.dot:hover{r:9}
.axl{font-family:ui-monospace,Menlo,monospace;font-size:9.5px;fill:var(--ink-3)}
.grid{stroke:var(--line);stroke-width:.5}
.mapsvg .grid{stroke:var(--ink-3);stroke-opacity:.28}
.legend[hidden]{display:none}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:var(--ink-2);padding:6px 2px 4px}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:9px;height:9px;border-radius:50%}

.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));
  gap:12px;margin:22px 0 8px}
label.f{display:flex;flex-direction:column;gap:5px}
label.f > span{font-family:"Avenir Next Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
select,input[type=text],input[type=number]{font-family:inherit;font-size:14.5px;
  color:var(--ink);background:var(--panel);border:1px solid var(--line);
  border-radius:2px;padding:8px 9px;width:100%}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);padding-top:20px}
input[type=range]{width:100%;accent-color:var(--accent);background:transparent;
  margin:6px 0 0;padding:0;height:18px}
.rngout{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums;
  font-size:12px;color:var(--ink-2);margin-top:1px}
.resetwrap{display:flex;align-items:flex-end;padding-top:20px}
.resetwrap .tbtn{width:100%}
.ctyrow{margin:24px 0 0}
.ctys{display:flex;flex-wrap:wrap;gap:8px;margin-top:7px}
.cchip{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;
  border:1px solid var(--line);border-radius:2px;padding:5px 11px;cursor:pointer;
  background:var(--panel);color:var(--ink-2);user-select:none}
.cchip:hover{color:var(--ink)}
.cchip:has(input:checked){border-color:var(--accent);color:var(--accent);
  background:var(--accent-soft)}
.cchip:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.cchip input{accent-color:var(--accent);margin:0}
.cchip .n{font-family:ui-monospace,Menlo,monospace;font-size:11px;opacity:.7}
.count{color:var(--ink-3);font-size:13.5px;margin:14px 0 16px}
.count b{color:var(--ink);font-weight:400}

.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:3px;
  padding:16px 17px 14px;display:flex;flex-direction:column;gap:11px;
  box-shadow:var(--shadow);scroll-margin-top:16px}
.card.sel{outline:2px solid var(--accent);outline-offset:-1px}
.selmark{display:flex;align-items:center;gap:7px;margin:-2px 0 -4px;
  font-family:"Avenir Next Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--accent)}
.selmark::before{content:"";width:14px;height:2px;background:var(--accent)}
.pill.wt{background:transparent;border:1px solid currentColor}
.ctop{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.cname{font-size:19px;line-height:1.15}
.cflag{font-size:11.5px;letter-spacing:.11em;color:var(--ink-3);
  font-family:ui-monospace,Menlo,monospace;white-space:nowrap;padding-top:4px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-family:"Avenir Next Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 8px;border-radius:2px;background:var(--panel-2);color:var(--ink-2)}
.pill.top{background:var(--accent);color:var(--panel)}
.pill.ban{background:var(--crit);color:var(--panel)}
.pill.perm{background:var(--warn);color:var(--panel)}
.desc{font-size:14.5px;color:var(--ink-2);margin:0}
.rows{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);
  padding-top:11px;font-size:13.5px}
.row{display:grid;grid-template-columns:74px 1fr;gap:10px;align-items:baseline}
.row .k{font-family:"Avenir Next Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.row .v{color:var(--ink-2)}
.stars{color:var(--accent);letter-spacing:.12em;font-size:13px}
.row .v{display:block}
.visbar{display:block;width:100%;height:5px;border-radius:3px;background:var(--panel-2);overflow:hidden;margin-top:5px}
.visbar i{display:block;height:100%}
.slp{display:inline-block;font-family:"Avenir Next Condensed","Roboto Condensed",sans-serif;
  font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;
  border-radius:2px;margin-right:6px;white-space:nowrap;border:1px solid transparent}
.slp.K2{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.slp.K1{background:var(--panel-2);color:var(--ink-2);border-color:var(--line)}
.slp.A{background:transparent;color:var(--warn);border-color:var(--warn)}
.slp.X{background:transparent;color:var(--ink-3);border-color:var(--line)}
.warnbox{font-size:13.5px;padding:9px 11px;border-radius:2px;
  background:var(--accent-soft);color:var(--ink);border-left:3px solid var(--warn)}
.warnbox.hard{border-left-color:var(--crit)}
.cfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;
  border-top:1px solid var(--line);padding-top:11px;font-size:13.5px}
.cost{color:var(--ink-2)}
.cost b{color:var(--ink);font-weight:400}
a.map{color:var(--accent);text-decoration:none;font-size:12px;letter-spacing:.09em;
  text-transform:uppercase;font-family:"Avenir Next Condensed","Roboto Condensed",sans-serif;
  border-bottom:1px solid var(--accent);padding-bottom:1px;white-space:nowrap}
a.map:hover{color:var(--ink);border-color:var(--ink)}

.panelbox{margin:44px 0 0;background:var(--panel);border:1px solid var(--line);
  border-radius:3px;padding:20px 18px}
.panelbox h2{font-size:22px;margin-bottom:4px}
.panelbox p.lead{color:var(--ink-2);font-size:14.5px;margin:6px 0 16px;max-width:70ch}
.bantab{width:100%;border-collapse:collapse;font-size:14px}
.bantab th{text-align:left;font-family:"Avenir Next Condensed","Roboto Condensed",sans-serif;
  font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);
  border-bottom:1px solid var(--line);padding:0 10px 7px 0}
.bantab td{border-bottom:1px solid var(--line);padding:9px 10px 9px 0;
  color:var(--ink-2);vertical-align:top}
.bantab td:first-child{color:var(--ink);white-space:nowrap}
.tabscroll{overflow-x:auto}

footer{border-top:1px solid var(--line);margin-top:44px;padding:22px 0 40px;
  color:var(--ink-3);font-size:13px}
footer p{margin:0 0 7px;max-width:72ch}
footer b{color:var(--ink-2);font-weight:400}

@media (max-width:700px){
  body{font-size:15.5px}
  .wrap{padding:0 14px}
  .hbar{padding:18px 0 14px;gap:14px}
  .chead{gap:10px}
  .chead .eyebrow{display:none}
  .chartbox{padding:14px 12px 6px;margin:18px 0}
  svg.depth{min-width:520px;height:240px}
  svg.mapsvg{min-width:560px}
  .chartscroll{margin:0 -12px;padding:0 12px}
  .controls{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
  .chk{padding-top:6px}
  .grid-cards{grid-template-columns:1fr;gap:12px}
  .card{padding:14px 14px 12px}
  .row{grid-template-columns:64px 1fr;gap:8px}
  .cfoot{flex-direction:column;align-items:flex-start;gap:8px}
  .panelbox{padding:16px 14px}
  .bantab{font-size:13.5px}
}
@media (max-width:420px){
  .controls{grid-template-columns:1fr 1fr}
  .segs,.gmapbtn{font-size:11px}
  .row{grid-template-columns:58px 1fr}
  .cname{font-size:17.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="wrap hbar">
    <div>
      <h1 id="h1"></h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="hbtns">
      <button class="tbtn" id="lang">EN</button>
      <button class="tbtn" id="theme"></button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="chartbox">
    <div class="chead">
      <h2 class="disp" style="font-size:19px" id="chartTitle"></h2>
      <div class="segs">
        <button class="seg on" id="segChart" data-v="chart"></button>
        <button class="seg" id="segMap" data-v="map"></button>
      </div>
      <a class="tbtn gmapbtn" id="gmap" target="_blank" rel="noopener"
        href="https://www.google.com/maps/d/viewer?mid=12yUS0svArYSvkcMHvIJfwbXHlj0QaVQ"></a>
      <span class="eyebrow" id="chartHint"></span>
    </div>
    <div class="chartscroll">
      <svg class="depth" id="chart" viewBox="0 0 900 300" preserveAspectRatio="none" role="img"></svg>
      <svg class="mapsvg" id="map" viewBox="0 0 900 600" role="img" hidden></svg>      </div>
    </div>
    <div class="tip" id="tip" hidden></div>
    <div class="legend" id="legend"></div>
  </section>

  <section class="controls">
    <label class="f"><span id="lC"></span><select id="fC"></select></label>
    <label class="f"><span id="lW"></span><select id="fW"></select></label>
    <label class="f"><span id="lD"></span><select id="fD"></select></label>
    <label class="f"><span id="lS"></span><select id="fS"></select></label>
    <label class="f"><span id="lQ"></span><input type="text" id="q"></label>
  </section>

  <section class="controls" style="margin-top:4px">
    <label class="f"><span id="lMaxH"></span>
      <input type="range" id="maxH" min="0.5" max="9" step="0.25" value="9">
      <output class="rngout" id="oMaxH"></output></label>
    <label class="f"><span id="lMinV"></span>
      <input type="range" id="minV" min="0" max="30" step="1" value="0">
      <output class="rngout" id="oMinV"></output></label>
    <label class="f"><span id="lMaxC"></span>
      <input type="range" id="maxC" min="20" max="300" step="10" value="300">
      <output class="rngout" id="oMaxC"></output></label>
    <div class="resetwrap"><button class="tbtn" id="reset"></button></div>
  </section>

  <section class="controls" style="margin-top:4px">
    <label class="f"><span id="lLkm"></span>
      <input type="number" id="lkm" value="5.5" step="0.1" min="1"></label>
    <label class="f"><span id="lEur"></span>
      <input type="number" id="eur" value="1.55" step="0.01" min="0.1"></label>
    <label class="chk"><input type="checkbox" id="fF"> <span id="lF"></span></label>
  </section>

  <section class="ctyrow">
    <span class="eyebrow" id="lV"></span>
    <div class="ctys" id="vig"></div>
  </section>

  <p class="count" id="count"></p>
  <div class="grid-cards" id="cards"></div>

  <section class="panelbox">
    <h2 class="disp" id="tollTitle"></h2>
    <p class="lead" id="tollLead"></p>
    <div class="tabscroll"><table class="bantab">
      <thead><tr><th id="thT1"></th><th style="text-align:right" id="thT2"></th>
        <th id="thT3"></th></tr></thead>
      <tbody id="tolls"></tbody>
    </table></div>
  </section>

  <section class="panelbox">
    <h2 class="disp" id="banTitle"></h2>
    <p class="lead" id="banLead"></p>
    <div class="tabscroll"><table class="bantab">
      <thead><tr><th id="thB1"></th><th id="thB2"></th></tr></thead>
      <tbody id="bans"></tbody>
    </table></div>
  </section>
</main>

<footer class="wrap" id="foot"></footer>

<script>
/* ── data ───────────────────────────────────────────────────────────────
   [name, cat, country, water, hours, visMin, visMax, freedive0-3,
    flag(0 none/1 heads-up/2 check), top5, sleepCode,
    sk:[desc, put-in, sleepText, note], en:[…]]                          */
const D=[
["Dunaj — Hainburg → Devín",1,"AT","rieka",0.5,1,2,0,1,0,"X",
 ["Prielom Dunaja medzi Hainburgom a Devínom. Národný park Donau-Auen po oboch brehoch, hrad Devín ako finále. Veľká rieka, hladký silný prúd.","~15 km po prúde, prúd ťa nesie a pádluješ len na korekciu. Dá sa pokračovať do Karloveského ramena. Najlepšie ráno, kým nefúka proti prúdu.","Jednodňovka — nič netreba, návrat autom alebo MHD z Devína","Hlavná plavebná dráha s nákladnou dopravou. Drž sa pri brehu a rátaj s vlnami od lodí."],
 ["The Danube gorge between Hainburg and Devín. Donau-Auen national park on both banks, Devín castle as the finale. Big river, smooth strong current.","~15 km downstream; the current carries you and you paddle only to steer. You can continue into the Karlova Ves channel. Best in the morning, before the headwind picks up.","Day trip — nothing needed, drive or take transit back from Devín","A main shipping lane with cargo traffic. Stay near the bank and expect wash from ships."]],
["Dunaj — Štúrovo → Szob",1,"SK","rieka",1.8,1,2,0,1,0,"K1",
 ["Začiatok Dunajského ohybu. Ostrihomská bazilika nad hlavou, ďalej sa rieka zatáča medzi Börzsöny a Pilis. Toto už poznáte.","~8 km po prúde, dá sa natiahnuť na Zebegény a Nagymaros. Prúd pomáha celý čas — na dlhý pohodový deň ideálne.","Kempy pri Štúrove a na maďarskom brehu","Nákladná doprava a vlny od výletných lodí. Návrat z výstupu si vyrieš vopred — druhé auto alebo vlak."],
 ["The start of the Danube Bend. The Esztergom basilica overhead, then the river curves between the Börzsöny and Pilis hills. You already know this one.","~8 km downstream, extendable to Zebegény and Nagymaros. The current helps the whole way — ideal for a long easy day.","Campsites near Štúrovo and on the Hungarian bank","Cargo traffic and wash from cruise boats. Sort the return from your take-out in advance — a second car or the train."]],
["Neusiedler See",1,"AT","jazero",1,0,0.3,0,0,0,"K2",
 ["Obrovský horizont a trstinové pásy. Úplne iná estetika ako hory.","Downwind Podersdorf → Illmitz pri severáku. Tréning na vietor pred morom.","Storchencamp Podersdorf — lacný, v sezóne plný",""],
 ["A vast horizon and reed belts. A completely different look from the mountains.","Downwind Podersdorf → Illmitz on a northerly. Wind practice before the sea.","Storchencamp Podersdorf — cheap, packed in season",""]],
["Lupa-tó",1,"HU","jazero",2,4,6,1,1,0,"K1",
 ["Biely piesok a tyrkysová štrkovňa na okraji Budapešti.","Pokojná hladina, dobrá na nácvik s tandemom.","Stan v okolí Lupa Beach","Platený vstup, je to vybudované kúpalisko — nie divoká príroda."],
 ["White sand and a turquoise gravel pit on the edge of Budapest.","Calm surface, good for tandem practice.","Tent pitches around Lupa Beach","Paid entry — it's a built-up lido, not wild nature."]],
["Stausee Ottenstein",1,"AT","jazero",1.75,2,4,1,0,0,"K2",
 ["Rozvetvené fjordovité ramená v lese, žulové brehy, skoro nikto.","Nástup Lichtenfels, prieskum bočných ramien k Dobra.","Camping Ottenstein priamo pri vode",""],
 ["Branching fjord-like arms in forest, granite banks, almost nobody.","Put in at Lichtenfels, explore the side arms toward Dobra.","Camping Ottenstein right on the water",""]],
["Lunzer See",1,"AT","jazero",2.25,4,8,2,0,0,"K2",
 ["Kompaktné jazero pod Ötscherom, lesnaté svahy padajúce do vody.","Okruh ~4 km. Západný breh je najstrmší — najlepší na freedive pozdĺž steny.","Camping Lunz am See, pár minút od brehu",""],
 ["A compact lake below the Ötscher, wooded slopes dropping into the water.","~4 km loop. The west shore is steepest — best for freediving along the wall.","Camping Lunz am See, minutes from the shore",""]],
["Erlaufsee",1,"AT","jazero",2.5,10,15,3,0,1,"A",
 ["Tyrkysovo-smaragdová farba, biele vápencové dno, strmé steny pod hladinou.","Nástup z pláže na juhu, prejsť k severnému brehu — stena padá kolmo do hĺbky.","Kemp Mariazell 6 km, inak sa dá prespať v aute na parkovisku",""],
 ["Turquoise-emerald water, white limestone bottom, steep walls below the surface.","Put in at the south beach, cross to the north shore — the wall drops vertically.","Campsite in Mariazell 6 km away, otherwise sleeping in the car at the lot works",""]],
["Walensee",3,"CH","jazero",8,8,15,3,0,0,"K2",
 ["Steny Churfirsten padajú 2000 m priamo do vody. Vodopády Seerenbach na severnom brehu, ktoré nemajú prístup z cesty.","Nástup Walenstadt alebo Murg, na sever popod Churfirsten k Seerenbachu. Strmé podvodné steny hneď za brehom.","Camping Walensee (Unterterzen), kempy pri Murgu",""],
 ["The Churfirsten walls drop 2000 m straight into the water. The Seerenbach falls on the north shore have no road access.","Put in at Walenstadt or Murg, north under the Churfirsten to the Seerenbach. Steep underwater walls just off the bank.","Camping Walensee (Unterterzen), campsites at Murg",""]],
["Urnersee — Vierwaldstättersee",3,"CH","jazero",8.5,8,12,3,0,0,"K2",
 ["Južné rameno Lucernského jazera — najfjordovitejšia časť, steny Uri Rotstock, lúka Rütli.","Nástup Flüelen alebo Isleten, na sever popri západnom brehu. Popoludní fúka Föhn — choď ráno.","Camping Windgällen (Flüelen), Camping Gotthard",""],
 ["The southern arm of Lake Lucerne — the most fjord-like part, the Uri Rotstock walls, the Rütli meadow.","Put in at Flüelen or Isleten, north along the west shore. The Föhn blows in the afternoon — go early.","Camping Windgällen (Flüelen), Camping Gotthard",""]],
["Caumasee — Flims",3,"CH","jazero",8,8,12,3,2,0,"K1",
 ["Tyrkysové lesné jazero na terase nad Rýnskou roklinou. Farba, ktorá nemá v Alpách veľa konkurencie.","Malé jazero, okruh do 2 km — ide o farbu a freedive, nie o kilometre.","Kempy vo Flims a Laax",
  "Malé jazero v chránenej zóne s plateným vstupom a vlastnou lodenicou — súkromné plavidlá môžu byť zakázané. Over pred cestou."],
 ["A turquoise forest lake on a terrace above the Rhine gorge. A colour with little competition in the Alps.","A small lake, under a 2 km loop — this is about the colour and the freediving, not distance.","Campsites in Flims and Laax",
  "A small lake in a protected zone with paid entry and its own boathouse — private craft may be banned. Check before you go."]],
["Leopoldsteinersee",2,"AT","jazero",3,8,12,3,2,0,"K1",
 ["Kolmá stena Pfaffensteinu padá priamo do jazera. Najfotogenickejšie malé jazero Štajerska.","Ak by SUP vyšiel: nástup pri parkovisku na juhu, pod stenu Pfaffensteinu.","Kemp v Eisenerz, ~3 km","Pravdepodobne ZAKÁZANÉ pre súkromné paddleboardy — len licencované loďky z požičovne a taxi-čln. Ferrata Kaiser Franz Josef výlet udrží aj tak."],
 ["The vertical Pfaffenstein wall drops straight into the lake. The most photogenic small lake in Styria.","If SUP is allowed: put in at the south car park, head under the Pfaffenstein wall.","Campsite in Eisenerz, ~3 km","Probably BANNED for private boards — only licensed rental boats and a boat taxi. The Kaiser Franz Josef via ferrata carries the trip anyway."]],
["Liptovská Mara",2,"SK","jazero",3,1,2,0,0,0,"K2",
 ["Západné Tatry a Chočské vrchy nad hladinou.","Vetrovka — dobrý downwind tréning. Nástup Liptovský Trnovec.","ATC Liptovský Trnovec",""],
 ["The Western Tatras and Chočské vrchy above the water.","Windy — good downwind practice. Put in at Liptovský Trnovec.","ATC Liptovský Trnovec",""]],
["Tisza-tó",2,"HU","jazero",3,0.5,1,0,0,0,"K1",
 ["Labyrint zatopeného lesa a kanálov, hniezdiská vtáctva.","Nástup Poroszló, bludisko kanálov. Drž 25 m od trstín.","Kempy pri Poroszló",""],
 ["A labyrinth of flooded forest and channels, bird nesting grounds.","Put in at Poroszló into the channel maze. Keep 25 m off the reeds.","Campsites near Poroszló",""]],
["Almsee",2,"AT","jazero",3.5,8,12,2,1,0,"K1",
 ["Totes Gebirge kolmo nad hladinou, mokraď na severnom konci. Azda najkrajšia kulisa Horného Rakúska.","Ak je plavba povolená: od parkoviska k severnej mokradi.","Kemp v Grünau im Almtal","Chránené územie — plavba býva obmedzená alebo zakázaná. Over, inak to ostáva hikingová zastávka."],
 ["The Totes Gebirge straight above the water, wetland at the north end. Perhaps the finest backdrop in Upper Austria.","If boating is allowed: from the car park to the northern wetland.","Campsite in Grünau im Almtal","Protected area — boating is often restricted or banned. Check, or it stays a hiking stop."]],
["Attersee",2,"AT","jazero",3.5,10,20,3,0,1,"K2",
 ["Východný breh Steinbach–Weissenbach je divoký, skalné steny nad vodou. Šťuky, pstruhy, raky.","Nástup Weissenbach, na sever pozdĺž skalnej steny. Pod hladinou strmé plotny.","Camping Weissenbach aj Steinbach priamo pri vode",""],
 ["The east shore Steinbach–Weissenbach is wild, rock walls above the water. Pike, trout, crayfish.","Put in at Weissenbach, north along the rock face. Steep slabs below the surface.","Camping Weissenbach and Steinbach, both on the water",""]],
["Traunsee",2,"AT","jazero",3.5,8,15,3,0,0,"K2",
 ["Stena Traunsteinu spadá do vody. Najhlbšie rakúske jazero, 191 m.","Nástup Traunkirchen, popri východnom brehu pod Traunstein. Drž sa do 100 m od brehu.","Camping Traunsee (Altmünster), Camping Ebensee",""],
 ["The Traunstein wall falls into the water. Austria's deepest lake at 191 m.","Put in at Traunkirchen, along the east shore under the Traunstein. Stay within 100 m of shore.","Camping Traunsee (Altmünster), Camping Ebensee",""]],
["Mondsee",2,"AT","jazero",3.5,5,8,2,0,0,"K2",
 ["Stena Drachenwand nad južným brehom. Najteplejšie zo Salzkammergutu, až 26 °C.","Nástup pod Drachenwand (Plomberg), krátky okruh 5–6 km popri stene.","Camping Mond-See-Land, Camping Austria",""],
 ["The Drachenwand face above the south shore. Warmest in the Salzkammergut, up to 26 °C.","Put in below the Drachenwand (Plomberg), a short 5–6 km loop along the wall.","Camping Mond-See-Land, Camping Austria",""]],
["Fuschlsee",2,"AT","jazero",3.5,8,12,3,0,0,"K1",
 ["Celoročný zákaz motorových člnov — jedna z najtichších vôd Salzkammergutu.","Okruh po obvode, trstinové plytčiny na pozorovanie ostriežov a šťúk.","Kempy pri Fuschl am See",""],
 ["A year-round motorboat ban — one of the quietest waters in the Salzkammergut.","Loop the shoreline; reed shallows for watching perch and pike.","Campsites near Fuschl am See",""]],
["Wolfgangsee",2,"AT","jazero",3.75,6,10,2,0,0,"K2",
 ["Kulisa Schafbergu, tiché zátoky medzi Sankt Gilgen a Fürberg.","Nástup Sankt Gilgen, na východ k Fürberg — zátoky neprístupné z cesty.","Camping Appesbach, Camping Lindenstrand",""],
 ["The Schafberg backdrop, quiet bays between Sankt Gilgen and Fürberg.","Put in at Sankt Gilgen, east toward Fürberg — bays unreachable by road.","Camping Appesbach, Camping Lindenstrand",""]],
["Hallstätter See",2,"AT","jazero",3.75,6,10,2,0,0,"K2",
 ["Dachsteinské steny nad vodou. Samotný Hallstatt je turistické peklo — ostaň na vode.","Nástup Obertraun, popri západnom brehu — je bez cesty a takmer prázdny.","Klausner-Höll (Hallstatt), Camping am See (Obertraun)",""],
 ["Dachstein walls above the water. Hallstatt itself is tourist hell — stay on the water.","Put in at Obertraun, along the west shore — roadless and almost empty.","Klausner-Höll (Hallstatt), Camping am See (Obertraun)",""]],
["Gosausee",2,"AT","jazero",4,8,15,2,0,0,"K1",
 ["Zrkadlový odraz Dachsteinského ľadovca. Jedna z najsilnejších scenérií Álp.","<b>Paddleboard je tu bez problémov povolený — overené na mieste.</b> Od parkoviska k západnému koncu pod ľadovec. Ľadová voda, 12–16 °C.","Camping Gosau (Gosauschmied)",""],
 ["A mirror reflection of the Dachstein glacier. One of the strongest views in the Alps.","<b>Paddleboarding is allowed here without any issue — verified on site.</b> From the car park to the west end below the glacier. Icy water, 12–16 °C.","Camping Gosau (Gosauschmied)",""]],
["Palcmanská Maša — Dedinky",2,"SK","jazero",4,2,4,1,0,0,"K2",
 ["Slovenský raj priamo nad hladinou, Havrania skala.","Okruh nádržou ~5 km. Ráno SUP, poobede Zejmarská roklina.","ATC Dedinky, autokemp Mlynky",""],
 ["Slovak Paradise right above the water, Havrania skala.","~5 km loop of the reservoir. SUP in the morning, Zejmarská gorge after.","ATC Dedinky, Mlynky car camp",""]],
["Jezioro Czorsztyńskie",2,"PL","jazero",4,2,4,1,0,0,"K2",
 ["Hrady Czorsztyn a Niedzica proti sebe nad vodou, Pieniny v pozadí.","Nástup Kluszkowce k hradu Niedzica. Okolo vedie cyklotrasa Velo Czorsztyn, 44 km.","Camping Łęg (Frydman) — 9 ha priamo pri jazere",""],
 ["Czorsztyn and Niedzica castles facing each other above the water, Pieniny behind.","Put in at Kluszkowce toward Niedzica castle. The 44 km Velo Czorsztyn cycle route rings the lake.","Camping Łęg (Frydman) — 9 ha right on the lake",""]],
["Wörthersee",2,"AT","jazero",4.25,4,6,1,0,0,"K2",
 ["Najteplejšie veľké alpské jazero, 26–28 °C. Západný koniec má tiché zalesnené brehy.","Nástup Reifnitz alebo Sekirn, pádlovať na západ. Východ je komerčný — vynechaj.","Camping Sabotnik, Camping Reichmann (Sekirn)",""],
 ["The warmest large alpine lake, 26–28 °C. The west end has quiet wooded shores.","Put in at Reifnitz or Sekirn and paddle west. The east end is commercial — skip it.","Camping Sabotnik, Camping Reichmann (Sekirn)",""]],
["Bledské jazero",2,"SI","jazero",4.5,5,8,1,2,0,"K1",
 ["Ostrov s kostolom, hrad na skale. Vizuálne top, ale preplnené.","Jediný zmysel: pádlovať o 6:00, keď je hmla nad vodou a jazero prázdne.","Camping Šobec (Lesce), 4 km — lacnejší než Camping Bled","Vlastný SUP vyžaduje platenú koncesiu. Over cenu a spôsob kúpy vopred."],
 ["The island church, the castle on its cliff. Visually top, but crowded.","Only worth it at 06:00, with mist on the water and the lake empty.","Camping Šobec (Lesce), 4 km — cheaper than Camping Bled","Your own SUP needs a paid permit. Check the price and where to buy it beforehand."]],
["Millstätter See",2,"AT","jazero",4.5,5,8,2,0,0,"K2",
 ["Najhlbšie korutánske jazero, Nockberge nad severným brehom.","Nástup Döbriach, popri južnom brehu — je strmší a tichší.","Kempy pri Döbriach",""],
 ["Carinthia's deepest lake, the Nockberge above the north shore.","Put in at Döbriach, along the south shore — steeper and quieter.","Campsites at Döbriach",""]],
["Faaker See",2,"AT","jazero",4.5,6,10,2,0,0,"K2",
 ["Karibská tyrkysová farba pod Mittagskogelom, ostrovček uprostred.","Nástup Drobollach, okruh okolo ostrova ~6 km. Motorové lode zakázané.","Camping Poglitsch, Camping Arneitz",""],
 ["Caribbean turquoise below the Mittagskogel, a small island in the middle.","Put in at Drobollach, ~6 km loop around the island. Motorboats banned.","Camping Poglitsch, Camping Arneitz",""]],
["Pressegger See",2,"AT","jazero",4.5,4,6,1,0,0,"K2",
 ["Až 28 °C — najteplejšie jazero Korutánska. Mokraď a trstina na severe.","Od kempu do trstinových kanálov na severnej strane. Drž odstup od hniezdisk.","Camping Weisses Rössl priamo na brehu",""],
 ["Up to 28 °C — the warmest lake in Carinthia. Wetland and reeds to the north.","From the campsite into the reed channels on the north side. Keep clear of nesting areas.","Camping Weisses Rössl right on the shore",""]],
["Zakrzówek — Krakov",2,"PL","jazero",4.5,8,15,3,2,0,"X",
 ["Zatopený vápencový lom, strmé steny, žiarivo modrá voda.","Profil ako stvorený na freedive — ale je to mestský areál s kúpaliskom.","Nič pri vode, kempy až v Krakove","Vybudované kúpalisko s plávajúcimi bazénmi. SUP v kúpacej zóne bude skoro isto zakázaný a odporuje to podmienke „žiadne mestské trasy“."],
 ["A flooded limestone quarry, steep walls, vivid blue water.","A profile made for freediving — but it's an urban site with a lido.","Nothing lakeside, campsites in Kraków","A built-up lido with floating pools. SUP in the swimming zone is almost certainly banned, and it contradicts the no-urban-routes rule."]],
["Bohinjské jazero",2,"SI","jazero",4.75,6,10,2,2,0,"K1",
 ["Julské Alpy zo všetkých strán, kostolík pri Ribčev Laz. Najkrajšie alpské jazero Slovinska.","Nástup Ukanc, na východ za svitania — vtedy je hladina zrkadlo.","Camp Danica (Boh. Bistrica) — lacnejší než Zlatorog pri vode","SUP vyžaduje platenú registráciu v Triglavskom NP. Choď v piatok večer — Bled–Bohinj stojí."],
 ["The Julian Alps on every side, the little church at Ribčev Laz. Slovenia's finest alpine lake.","Put in at Ukanc and head east at dawn — that's when the surface is a mirror.","Camp Danica (Boh. Bistrica) — cheaper than Zlatorog on the water","SUP requires paid registration in Triglav NP. Drive Friday evening — the Bled–Bohinj road jams."]],
["Weissensee",2,"AT","jazero",4.75,8,15,3,0,1,"K2",
 ["Kvalita pitnej vody, zákaz motorových lodí, západná polovica bez prístupovej cesty.","Nástup Techendorf, na západ 8–10 km. Celodenná misia s obedom na brehu.","Camping Knaller aj Camping Müller priamo pri vode",""],
 ["Drinking-water quality, motorboats banned, and the western half has no access road.","Put in at Techendorf, 8–10 km west. A full-day mission with lunch on the bank.","Camping Knaller and Camping Müller, both on the water",""]],
["Soča — Čezsoča → Srpenica 1",2,"SI","rieka",5,8,15,3,2,0,"K1",
 ["Ikonická tyrkysová voda medzi vápencovými blokmi. Vzdutie pod Mostom na Soči je jazerné — pokojné, s kaňonovými stenami.","Overené úseky: <b>Čezsoča → Srpenica 1</b> (WW I–II) — vo dvojici v pohode, toto je etalón. <b>Srpenica 1 → Srpenica 2</b> — len sólo, tu začína raftový úsek. <b>Srpenica 2 → Trnovo 1</b> — len raftom, na paddleboard nie. Celé Srpenica 1 → Trnovo 1 je WW II–III, pri vysokom stave IV. Na freedive je najlepšie vzdutie pod Mostom na Soči — tyrkys bez prúdu.","Camp Vodenca (Bovec), Camp Lazar (Kobarid)","Povinná SUP permitka a sezónne obmedzenia úsekov. Over pred cestou."],
 ["Iconic turquoise water between limestone blocks. The backwater below Most na Soči is lake-like — calm, with canyon walls.","Sections we've run: <b>Čezsoča → Srpenica 1</b> (WW I–II) — comfortable as a pair, this is the benchmark. <b>Srpenica 1 → Srpenica 2</b> — solo only; the rafting stretch starts here. <b>Srpenica 2 → Trnovo 1</b> — raft only, not for a board. The whole Srpenica 1 → Trnovo 1 is WW II–III, IV at high water. For freediving the Most na Soči backwater is best — turquoise without current.","Camp Vodenca (Bovec), Camp Lazar (Kobarid)","A SUP permit is mandatory and sections close seasonally. Check before you go."]],
["Lago del Predil",2,"IT","jazero",5.25,8,12,3,0,0,"A",
 ["Julské Alpy z talianskej strany, opustené bane, kulisa Mangartu. Všetci idú do Slovinska.","Nástup od severného parkoviska, okruh 4 km. Strmé svahy hneď za plytčinou.","Kempy až v Tarvisiu — pri jazere sa dá prespať v aute",""],
 ["The Julian Alps from the Italian side, abandoned mines, the Mangart backdrop. Everyone else goes to Slovenia.","Put in at the north car park, 4 km loop. Steep slopes just past the shallows.","Campsites in Tarvisio — sleeping in the car by the lake works",""]],
["Strunjan",2,"SI","more",5.5,5,10,2,0,0,"K2",
 ["Najvyšší flyšový útes Jadranu, soľné panvy Sečovlje.","Nástup Strunjan, popod útes k Mesečevmu zálivu. Krátko, ale efektne.","Camping Strunjan, Camping Lucija (Portorož)",""],
 ["The highest flysch cliff on the Adriatic, the Sečovlje salt pans.","Put in at Strunjan, under the cliff to Moon Bay. Short but striking.","Camping Strunjan, Camping Lucija (Portorož)",""]],
["Lago di Cavazzo",2,"IT","jazero",5.5,4,8,2,0,0,"K2",
 ["Karnské Alpy nad hladinou, tichý východný breh. Málo známe.","Nástup Somplago, okruh ~8 km. Motorové lode zakázané.","Camping Al Lago (Bordano) — jednoduchý a lacný",""],
 ["The Carnic Alps above the water, a quiet east shore. Little known.","Put in at Somplago, ~8 km loop. Motorboats banned.","Camping Al Lago (Bordano) — simple and cheap",""]],
["Mrežnica",2,"HR","rieka",5.5,6,12,2,0,0,"K2",
 ["Desiatky travertínových kaskád a hlbokých krasových bazénov pod nimi.","Pereje WW1–2, veľa prenášania paddleboardu. Krok nahor od Soče bez toho, aby to bolo nebezpečné.","Camp Slapić priamo pri rieke",""],
 ["Dozens of travertine cascades with deep karst pools below them.","WW1–2 rapids, plenty of portaging. A step up from the Soča without being dangerous.","Camp Slapić right on the river",""]],
["Achensee",3,"AT","jazero",5.5,8,12,3,0,0,"K2",
 ["9 km dlhý fjord medzi Karwendelom a Rofanom. Severný koniec je divoký.","Nástup Achenkirch, na juh popri západnom brehu pod steny. Popoludní fúka — choď ráno.","Camping Schwarzenau (Achenkirch), Camping Karwendel",""],
 ["A 9 km fjord between the Karwendel and Rofan. The north end is wild.","Put in at Achenkirch, south along the west shore under the walls. It blows in the afternoon — go early.","Camping Schwarzenau (Achenkirch), Camping Karwendel",""]],
["Eibsee",3,"DE","jazero",5.75,8,15,3,1,0,"K1",
 ["Zugspitze kolmo nad jazerom, osem ostrovčekov, biele štrkové dno.","Okruh cez ostrovčeky ~7 km. O 10:00 je tam dav — choď skoro ráno.","Camping Zugspitze (Grainau), Camping Isarhorn","Parkovisko je platené a drahé, ~10 €/deň — prespanie v aute tam nečakaj."],
 ["The Zugspitze straight above the lake, eight islets, white gravel bottom.","~7 km loop through the islets. Crowded by 10:00 — go at dawn.","Camping Zugspitze (Grainau), Camping Isarhorn","Parking is paid and pricey, ~€10/day — don't expect to sleep in the car there."]],
["Lago di Barcis",3,"IT","jazero",6,6,10,2,0,0,"K1",
 ["Valcellina — kaňon nad jazerom. Talianska farba vody bez talianskych davov.","Nástup od promenády v Barcis, do západného ramena pod kaňon. Okruh ~6 km.","Camping Valcellina (Claut), agrikempy okolo Barcis",""],
 ["Valcellina — a canyon above the lake. Italian water colour without the Italian crowds.","Put in at the Barcis promenade, into the west arm below the canyon. ~6 km loop.","Camping Valcellina (Claut), farm campsites around Barcis",""]],
["Gacka",3,"HR","rieka",6,10,20,2,1,0,"K1",
 ["Ponorná krasová rieka, veľmi nízky obsah sedimentov — pstruhy vidno z paddleboardu.","Pokojný meandrujúci tok. Úzka — na tandem maximálne dvaja.","Kamp Velebit","Z veľkej časti obhospodarovaná ako rybársky revír — plavba môže byť obmedzená alebo spoplatnená."],
 ["A sinking karst river with very little sediment — you can see trout from the board.","A calm meandering flow. Narrow — two people max on a tandem.","Kamp Velebit","Largely managed as a fly-fishing beat — paddling may be restricted or charged."]],
["Walchensee",3,"DE","jazero",6,10,15,3,1,0,"K2",
 ["Bavorské Karibiky — tyrkysová farba, Herzogstand nad tým. Známy nemecký freedive spot.","Nástup Sachenbach alebo Einsiedl k polostrovu Zwergern. Na vode buď do 12:00.","Camping Walchensee (Einsiedl), Camping am Kesselberg","Popoludní silný termický vietor — preto je to windsurf mekka."],
 ["The Bavarian Caribbean — turquoise water, the Herzogstand above. A known German freedive spot.","Put in at Sachenbach or Einsiedl toward the Zwergern peninsula. Be off the water by noon.","Camping Walchensee (Einsiedl), Camping am Kesselberg","Strong thermal wind in the afternoon — that's why it's a windsurf mecca."]],
["Solina",3,"PL","jazero",6,3,5,1,0,0,"K2",
 ["Bieszczady — najprázdnejšie hory strednej Európy. Rozvetvené ramená, medvede.","Nástup Polańczyk do severných ramien. Veľké jazero — dá sa robiť viacdňová misia.","Kempy okolo Polańczyk a Solina",""],
 ["The Bieszczady — the emptiest mountains in Central Europe. Branching arms, bears.","Put in at Polańczyk into the northern arms. Big enough for a multi-day mission.","Campsites around Polańczyk and Solina",""]],
["Plansee + Heiterwanger See",3,"AT","jazero",6.25,10,20,3,1,1,"K2",
 ["Dve jazerá spojené 300 m kanálom, hĺbka 78 m, na dne potopené člny a koče.","Prepádlovať kanálom z jedného do druhého — 18 km trasa, presne to, kvôli čomu má SUP zmysel.","Camping Seespitze priamo na brehu, ďalej Sennalpe a Fischer am See","Divoké stanovanie kontroluje horská stráž, pokuta 220 € — v aute tu neprespíš."],
 ["Two lakes joined by a 300 m channel, 78 m deep, sunken boats and carriages on the bottom.","Paddle the channel from one into the other — an 18 km route, exactly what a board is for.","Camping Seespitze on the shore, plus Sennalpe and Fischer am See","Mountain rangers police wild camping, €220 fine — sleeping in the car is out here."]],
["Fernsteinsee",3,"AT","jazero",6.5,15,25,3,2,0,"K1",
 ["Neuveriteľná tyrkysovo-modrá, potopený les a kamenné útvary. Legendárny freedive spot.","Ak vyjdú pravidlá, je to najlepšia sladká voda v zozname. Studená — treba 7 mm.","Kempy v Nassereith, Camping Rossbach","V súkromnej správe hotela Schloss Fernsteinsee — vstup za poplatok, môže byť len pre potápačov."],
 ["Improbable turquoise-blue, a sunken forest and rock formations. A legendary freedive spot.","If the rules work out, it's the best fresh water on this list. Cold — you'll want 7 mm.","Campsites in Nassereith, Camping Rossbach","Privately managed by Hotel Schloss Fernsteinsee — paid entry, possibly divers only."]],
["Blindsee",3,"AT","jazero",6.5,12,20,3,2,0,"K1",
 ["Potopený les — kmene stojace pod hladinou, vidno ich priamo z paddleboardu.","Pádluj nad potopenými stromami, freedive po kmeňoch nadol.","Kemp Biberwier, Camping Ehrwald","Súkromný pozemok, vstup za poplatok — over. Plansee + Blindsee + Fernsteinsee sú do 25 km od seba."],
 ["A sunken forest — trunks standing below the surface, visible straight from the board.","Paddle over the drowned trees and freedive down along the trunks.","Biberwier campsite, Camping Ehrwald","Private land, paid entry — check. Plansee, Blindsee and Fernsteinsee are within 25 km of each other."]],
["Lago di Ledro",3,"IT","jazero",6.5,8,12,3,0,0,"K2",
 ["Pokojnejší brat Gardy, 600 m n. m., kolové obydlia UNESCO na brehu.","Nástup Pieve di Ledro, okruh ~10 km. Motorové lode zakázané.","Camping Al Sole, Camping Azzurro (Pieve di Ledro)",""],
 ["Garda's quieter sibling at 600 m, with UNESCO pile dwellings on the shore.","Put in at Pieve di Ledro, ~10 km loop. Motorboats banned.","Camping Al Sole, Camping Azzurro (Pieve di Ledro)",""]],
["Stara Baška — Krk",3,"HR","more",6.5,15,25,3,0,1,"K2",
 ["Holé mesačné svahy, výhľad na Prvić a Goli otok. Zátoky bez prístupu z cesty.","Na juh k Oprni — dostupné len z vody alebo pešo. Stena do 20 m hneď pri brehu.","Camping Škrila (Stara Baška) priamo nad zátokami",""],
 ["Bare lunar slopes, views to Prvić and Goli otok. Coves with no road access.","South toward Oprna — reachable only from the water or on foot. A 20 m wall right off the shore.","Camping Škrila (Stara Baška) directly above the coves",""]],
["Vrsar — súostrovie",3,"HR","more",6.5,10,20,3,0,0,"K2",
 ["Osemnásť ostrovčekov roztrúsených pár kilometrov od brehu. Západná Istria bez rovinjských davov.","Nástup Vrsar alebo Koversada, preskakovať medzi ostrovčekmi — Sveti Juraj, Galopun, Lakal. Otvorené more, choď za pokojného rána.","Camping Valkanela, Camping Porto Sole — priamo pri mori",""],
 ["Eighteen islets scattered a few kilometres offshore. West Istria without the Rovinj crowds.","Put in at Vrsar or Koversada and hop between the islets — Sveti Juraj, Galopun, Lakal. Open sea, go on a calm morning.","Camping Valkanela, Camping Porto Sole — right on the sea",""]],
["Limski kanal",3,"HR","more",6.5,5,10,2,1,0,"K1",
 ["Desaťkilometrový zatopený kaňon so stometrovými stenami — jediný skutočný fjordový záliv Jadranu.","Nástup pri ústí od Vrsaru, pádlovať dovnútra medzi steny. Voda je brakická a kalnejšia než otvorené more — je to o scenérii, nie o freedive.","Kempy pri Vrsare, ~5 km","Chránený morský rezervát s farmami na mušle a ustrice — kúpanie je v častiach zakázané a plavba regulovaná. Drž sa mimo bójkovaných chovných polí."],
 ["A ten-kilometre drowned canyon with hundred-metre walls — the Adriatic's only true fjord-like inlet.","Put in near the mouth at Vrsar and paddle inward between the walls. The water is brackish and murkier than the open sea — this is about scenery, not freediving.","Campsites near Vrsar, ~5 km","A protected marine reserve with mussel and oyster farms — swimming is banned in places and boating regulated. Stay clear of the buoyed farming beds."]],
["Kamenjak — Premantura",3,"HR","more",6.5,15,25,3,1,0,"K2",
 ["Divoký park na južnom cípe Istrie — útesy, oblúky, jaskyňa Kolombarica.","Nástup z pláže Debeljak okolo cípu k jaskyni.","Camping Kažela, Camping Runke — cenovo znesiteľné","Prúd a vietor v úžine k ostrovu Porer — nechoď ďaleko od brehu."],
 ["A wild park on Istria's southern tip — cliffs, arches, the Kolombarica cave.","Put in at Debeljak beach and round the cape to the cave.","Camping Kažela, Camping Runke — bearable on price","Current and wind in the channel toward Porer island — don't go far from shore."]],
["Lago di Tenno",3,"IT","jazero",6.75,8,12,3,1,0,"K1",
 ["Farba, ktorá vyzerá vyfotošopovaná. Ostrovček spojený s brehom pešou kosou.","Okruh 2 km, freedive okolo ostrovčeka.","Kempy v Riva del Garda, ~10 km","Malé chránené jazero — pravidlá plavby sa menia, over."],
 ["A colour that looks retouched. A small island joined to the bank by a walkable spit.","2 km loop, freediving around the islet.","Campsites in Riva del Garda, ~10 km","A small protected lake — boating rules change, check."]],
["Lago di Garda — sever",3,"IT","jazero",6.75,6,12,2,2,0,"K2",
 ["Kolmé steny Monte Brione a Cima Capi padajúce do vody. Fjordový charakter severu.","Nástup Torbole na západ pod steny k Ponale.","Camping Maroadi (Torbole), Camping Al Lago — 25–35 €/noc za dvoch","Vietor Ora fúka od poludnia 4–6 Bft. Na vode len 6:00–11:00, popoludní je to pre SUP nebezpečné."],
 ["The vertical faces of Monte Brione and Cima Capi dropping into the water. The north end is fjord-like.","Put in at Torbole, west under the walls toward Ponale.","Camping Maroadi (Torbole), Camping Al Lago — €25–35/night for two","The Ora wind blows 4–6 Bft from midday. On the water 06:00–11:00 only; afternoons are dangerous for SUP."]],
["Cres — Sv. Ivan",3,"HR","more",7,20,30,3,1,1,"K2",
 ["Najčistejšie more severného Jadranu. Pláž pod Lubenicami dostupná len pešo alebo z vody.","<b>Tu ste už boli — zostup pešo z Lubeníc bol masaker.</b> Presne preto sem patrí paddleboard: nástup Valun alebo Martinšćica, 5–8 km popri pobreží, žiadne šľapanie po sute. Steny do 30 m hneď za brehom.","Camping Slatina (Martinšćica), Camping Kovačine (Cres)","Trajekt Brestova–Porozina. Ráta sa s minimálne štyrmi dňami."],
 ["The clearest sea in the northern Adriatic. The beach below Lubenice is reachable only on foot or from the water.","<b>You've been here — the walk down from Lubenice was brutal.</b> That's exactly why a board belongs here: put in at Valun or Martinšćica, 5–8 km along the coast, no scree descent. Walls to 30 m just off the shore.","Camping Slatina (Martinšćica), Camping Kovačine (Cres)","Ferry Brestova–Porozina. Budget four days minimum."]],
["Lago di Molveno",3,"IT","jazero",7,8,12,3,0,0,"K2",
 ["Brenta Dolomity kolmo nad hladinou. Pravdepodobne najkrajšia kulisa zoznamu.","Od severnej pláže na juh k divokému koncu. Ráno sa Brenta odráža v hladine.","Camping Spiaggia Lago di Molveno priamo pri vode",""],
 ["The Brenta Dolomites straight above the water. Probably the finest backdrop on this list.","From the north beach south to the wild end. At dawn the Brenta reflects in the surface.","Camping Spiaggia Lago di Molveno right on the water",""]],
["Bodensee",3,"AT","jazero",8,4,8,1,0,0,"K1",
 ["Pádlovanie cez tri krajiny, ostrov Mainau, kláštor Reichenau.","Veľká voda s hustou lodnou dopravou. Na freedive slabé.","Kempy pri Bregenzi",""],
 ["Paddling across three countries, Mainau island, Reichenau abbey.","Big water with heavy boat traffic. Weak for freediving.","Campsites near Bregenz",""]],
["Zrmanja",3,"HR","rieka",8,5,10,2,1,0,"K1",
 ["200 m vysoké steny kaňonu, travertínové kaskády. Natáčal sa tu Winnetou.","Po prúde. Úsek Muškovci → Obrovac je pokojnejší a na vašu úroveň akurát.","Camp Zrmanja (Kaštel Žegarski), kempy v Obrovci","8 h je na hranici — má zmysel len ako 4-dňovka, ideálne spojená s Krkom cestou späť."],
 ["200 m canyon walls, travertine cascades. Winnetou was filmed here.","Downstream. The Muškovci → Obrovac section is calmer and right at your level.","Camp Zrmanja (Kaštel Žegarski), campsites in Obrovac","8 h is the limit — only worth it as a four-day trip, ideally paired with Krk on the way back."]]
];

/* Hodnotenie 0–100. Váhy: viditeľnosť je hlavné kritérium, freedive vhodnosť druhé,
   TOP 5 je môj subjektívny bonus (jedinečnosť, prístup len z vody), obmedzenia sťahujú dole. */
function score(x){
  const vis=Math.min(((x[5]+x[6])/2)/25,1)*55;   // 0–55
  const fd=(x[7]/3)*25;                          // 0–25
  const top=x[9]?12:0;                           // 12
  const pen=x[8]===2?16:x[8]===1?5:0;            // −16 / −5
  return Math.max(0,Math.min(100,Math.round(vis+fd+top+8-pen)));
}

const slug=n=>n.replace(/[^a-zA-Z0-9]/g,"");

function view(){

        q=$("q").value.trim().toLowerCase(),f=$("fF").checked,s=$("fS").value,

    &&(d==="all"||x[1]==+d)&&(!f||x[7]>=2)
    &&x[4]<=mh&&x[6]>=mv&&(mc>=300||trip(x)<=mc)
    &&(!q||(x[0]+" "+txt(x).join(" ")).toLowerCase().includes(q)));
  r.sort((a,b)=>s==="time"?a[4]-b[4]:s==="cost"?trip(a)-trip(b):s==="rating"?score(b)-score(a)||b[6]-a[6]:(b[6]-a[6])||(a[4]-b[4]));
  return r;
}

      <div class="pills">
        <span class="pill">${c.durShort[cat]} · ${String(h).replace(".",L==="sk"?",":".")} h</span>
        <span class="pill wt" style="color:${wColor(w)}">${c.wShort[w]}</span>
        ${top?`<span class="pill top">${c.top}</span>`:""}
        ${flag===2?`<span class="pill ban">${c.check}</span>`
          :flag===1?`<span class="pill perm">${c.heads}</span>`:""}
      </div>
      <p class="desc">${desc}</p>
      <div class="rows">
        <div class="row"><span class="k">${c.kRate}</span><span class="v"><span class="stars">${stars(score(x))}</span><span class="mono" style="color:var(--ink-3)"> ${score(x)}/100</span></span></div>
        <div class="row"><span class="k">${c.kVis}</span><span class="v mono">${v1}–${v2} m
          <span class="visbar"><i style="width:${Math.min(vm/25*100,100)}%;
          background:${visColor(vm)}"></i></span></span></div>
        <div class="row"><span class="k">${c.kSup}</span><span class="v">${sup}</span></div>
        <div class="row"><span class="k">${c.kSleep}</span><span class="v"><span
          class="slp ${sc}">${c.sleep[sc]}</span>${stxt}</span></div>
        <div class="row"><span class="k">${c.kToll}</span><span class="v">${
          keys.length?keys.map(k=>`${L==="sk"?T[k][2]:T[k][3]} <span class="mono">${
            L==="sk"?num(T[k][1])+" €":"€"+num(T[k][1])}</span>`).join(" · "):c.noToll}</span></div>
      </div>
      ${note?`<p class="warnbox${flag===2?" hard":""}">${note}</p>`:""}
      <div class="cfoot">
        <span class="cost">${c.roundtrip} <b class="mono">${
          L==="sk"?Math.round(trip(x))+" €":"€"+Math.round(trip(x))}</b>
          <span style="color:var(--ink-3)">${
            c.breakdown(Math.round(fuel(h)),Math.round(tollSum(n,co)))}</span></span>
        <a class="map" target="_blank" rel="noopener"
          href="https://www.google.com/maps/search/?api=1&query=${
            encodeURIComponent(n+" "+co)}">${c.map}</a>
      </div></article>`}).join("");
}

function chart(){
  const r=view(),W=900,H=300,Lm=44,R=14,Tp=16,B=30;
  const x=h=>Lm+(h/9)*(W-Lm-R), y=v=>Tp+(Math.min(v,30)/30)*(H-Tp-B);
  let s="";
  for(let h=0;h<=9;h++)s+=`<line class="grid" x1="${x(h)}" y1="${Tp}" x2="${x(h)}" y2="${H-B}"/>`
    +`<text class="axl" x="${x(h)}" y="${H-B+14}" text-anchor="middle">${h} h</text>`;
  for(let v=0;v<=30;v+=10)s+=`<line class="grid" x1="${Lm}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}"/>`
    +`<text class="axl" x="${Lm-6}" y="${y(v)+3}" text-anchor="end">${v} m</text>`;
  r.forEach(d=>{const id=slug(d[0]),on=SEL===id;
    s+=`<circle class="dot" cx="${x(d[4])}" cy="${y((d[5]+d[6])/2)}"
    r="${on?9:d[9]?7.5:5.5}" fill="${wColor(d[3])}" fill-opacity="${on||d[9]?1:.62}"
    stroke="${on?"var(--accent)":d[9]?"var(--ink)":"none"}" stroke-width="${on?3:1.2}"
    tabindex="0" role="button" aria-label="${d[0]}" data-t="${id}"
    data-n="${d[0]}" data-h="${d[4]}" data-v="${d[5]}–${d[6]}"></circle>`});
  $("chart").innerHTML=s;
  wire($("chart"));
}

/* ── mapa ── */
const LAT0=50.4,LON0=8.2,KX=Math.cos(47.5*Math.PI/180),MSC=88,MPAD=18;
const px=lon=>MPAD+(lon-LON0)*KX*MSC, py=lat=>MPAD+(LAT0-lat)*MSC;
/* LAND a LAKES sú [lon,lat]; ostatné dáta appky [lat,lon] — preto dve funkcie. */
const ptsLL=a=>a.map(p=>`${px(p[0]).toFixed(1)},${py(p[1]).toFixed(1)}`).join(" ");

function map(){
  const r=view(),c=t(),W=900,H=600;
  let s=`<rect x="0" y="0" width="${W}" height="${H}" class="sea"/>`;
  LAND.forEach(r=>{s+=`<polygon class="land" points="${ptsLL(r)}"/>`});
  LAKES.forEach(r=>{s+=`<polygon class="lake" points="${ptsLL(r)}"/>`});

  for(let lon=9;lon<=23;lon++){const X=px(lon);if(X<0||X>W)continue;
    s+=`<line class="grid" x1="${X}" y1="0" x2="${X}" y2="${H}"/>`;
    if(lon%2===1)s+=`<text class="axl" x="${X+3}" y="${H-6}">${lon}°E</text>`}
  for(let lat=44;lat<=50;lat++){const Y=py(lat);if(Y<0||Y>H)continue;
    s+=`<line class="grid" x1="0" y1="${Y}" x2="${W}" y2="${Y}"/>`;
    s+=`<text class="axl" x="5" y="${Y-4}">${lat}°N</text>`}

  const hx=px(HOME[1]),hy=py(HOME[0]);
  [[2.5,187],[5,375],[9,675]].forEach(([h,km])=>{const rad=km/111*MSC;
    s+=`<circle class="ring" cx="${hx}" cy="${hy}" r="${rad.toFixed(1)}"/>`;
    s+=`<text class="ringlab" x="${hx-4}" y="${(hy-rad+13).toFixed(1)}" text-anchor="end">${
      String(h).replace(".",L==="sk"?",":".")} h</text>`});

  LANDLAB.forEach(([lat,lon,k])=>{const X=px(lon),Y=py(lat);
    if(X<10||X>W-10||Y<10||Y>H-10)return;
    s+=`<text class="cname-lab" x="${X}" y="${Y}" text-anchor="middle">${c.cname[k]||k}</text>`});

  r.forEach(d=>{const co=CO[d[0]];if(!co)return;
    const id=slug(d[0]),on=SEL===id;
    s+=`<circle class="dot" cx="${px(co[1]).toFixed(1)}" cy="${py(co[0]).toFixed(1)}"
      r="${on?9:d[9]?7.5:5.5}" fill="${wColor(d[3])}" fill-opacity="${on||d[9]?1:.75}"
      stroke="${on?"var(--accent)":"var(--panel)"}" stroke-width="${on?3:1.2}"
      tabindex="0" role="button" aria-label="${d[0]}" data-t="${id}"
      data-n="${d[0]}" data-h="${d[4]}" data-v="${d[5]}–${d[6]}"></circle>`});

  s+=`<circle class="home" cx="${hx}" cy="${hy}" r="4.5"/>`
   +`<text class="homelab" x="${hx+9}" y="${hy+4}">Bratislava</text>`;
  $("map").innerHTML=s;
  wire($("map"));
}

function wire(svg){
  const tip=$("tip"),box=document.querySelector(".chartbox");
  tip.hidden=true;
  const show=el=>{const b=box.getBoundingClientRect(),e=el.getBoundingClientRect();
    tip.innerHTML=`<b>${el.dataset.n}</b><i>${el.dataset.h} h · ${el.dataset.v} m</i>`;
    tip.hidden=false;
    tip.style.left=(e.left+e.width/2-b.left)+"px";
    tip.style.top=(e.top-b.top)+"px"};
  const hide=()=>{tip.hidden=true};
  svg.querySelectorAll(".dot").forEach(el=>{
    const go=()=>{SEL=el.dataset.t;draw();
      const cd=$("c-"+SEL);if(!cd)return;
      cd.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches
        ?"auto":"smooth",block:"center"})};
    el.addEventListener("mouseenter",()=>show(el));
    el.addEventListener("focus",()=>show(el));
    el.addEventListener("mouseleave",hide);
    el.addEventListener("blur",hide);
    el.addEventListener("click",go);
    el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}})});
}

  ||(!root.hasAttribute("data-theme")&&matchMedia("(prefers-color-scheme:dark)").matches);
